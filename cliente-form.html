<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaisMed | Cliente</title>
  <script>document.documentElement.setAttribute("data-tema",localStorage.getItem("tema")==="escuro"||localStorage.getItem("tema")==="preto"?"escuro":"claro")</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header header-compact">
      <a href="painel-profissional.html" class="back-btn" data-fallback="painel-profissional.html"></a>
      <div class="logo logo-inline"><span class="logo-icon"></span><span>CaisMed</span></div>
    </header>
    <main class="app-body">
      <p class="intro-text left" id="titulo-cliente">Cadastrar Novo Cliente</p>
      <form id="cliente-form">
        <div class="field"><label for="nome">Nome Completo</label><input id="nome" required /></div>
        <div class="field"><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" maxlength="11" required /></div>
        <div class="field"><label for="nascimento">Data de Nascimento</label><input id="nascimento" type="date" required /></div>
        <div class="field"><label for="telefone">Telefone</label><input id="telefone" type="tel" required /></div>
        <div class="field"><label for="email">E-mail</label><input id="email" type="email" required /></div>
        <div class="field"><label for="cidade">Cidade</label><input id="cidade" required /></div>
        <label>Plano do Cliente</label>
        <div class="plan-grid" id="plan-grid"></div>
        <div class="field"><label for="pagamento">Forma de Pagamento</label>
          <select id="pagamento" required><option value="Pix">Pix</option><option value="Cartão de Crédito">Cartão de Crédito</option><option value="Boleto">Boleto</option></select></div>
        <div class="bottom-area"><button type="submit" class="btn">Salvar Cliente</button></div>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
