<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha</title>
  <script>document.documentElement.setAttribute("data-tema",localStorage.getItem("tema")==="escuro"||localStorage.getItem("tema")==="preto"?"escuro":"claro")</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header center-header">
      <a href="index.html" class="back-btn" data-fallback="index.html"></a>
      <div class="logo">
        <span class="logo-icon"></span>
        <span>CaisMed</span>
      </div>
    </header>

    <main class="app-body center">
      <p class="intro-text left">Informe seu cpf para mudar sua senha</p>

      <form id="recuperar-form">
        <div class="field">
          <label for="cpf-recuperar">CPF</label>
          <input type="text" id="cpf-recuperar" name="cpf" inputmode="numeric" pattern="[0-9]*" maxlength="11" required />
        </div>

        <button type="submit" class="btn">enviar</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
