<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaisMed | Minha Carteirinha</title>
  <script>document.documentElement.setAttribute("data-tema",localStorage.getItem("tema")==="escuro"||localStorage.getItem("tema")==="preto"?"escuro":"claro")</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header header-compact">
      <a href="home.html" class="back-btn" data-fallback="home.html"></a>
      <div class="logo logo-inline"><span class="logo-icon"></span><span>CaisMed</span></div>
    </header>
    <main class="app-body">
      <p class="intro-text left">Minha Carteirinha</p>
      <div class="cart" id="carteirinha">
        <div class="cart-top"><b>CaisMed</b><span id="cart-plano"></span></div>
        <div class="cart-num" id="cart-num"></div>
        <div class="cart-nome" id="cart-nome"></div>
      </div>
      <p class="aviso">Apresente este cartão na recepção da clínica.</p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
