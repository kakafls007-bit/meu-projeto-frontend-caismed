<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaisMed | Primeiro Acesso</title>
  <script>document.documentElement.setAttribute("data-tema",localStorage.getItem("tema")==="escuro"||localStorage.getItem("tema")==="preto"?"escuro":"claro")</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header center-header">
      <a href="index.html" class="back-btn" data-fallback="index.html"></a>
      <div class="logo"><span class="logo-icon"></span><span>CaisMed</span></div>
    </header>
    <main class="app-body">
      <p class="intro-text">Primeiro Acesso</p>
      <p class="aviso" style="margin-bottom:16px">Informe o CPF cadastrado na clínica e crie a sua senha.</p>
      <form id="primeiro-acesso-form">
        <div class="field"><label for="cpf">CPF</label><input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="11" required /></div>
        <div class="field"><label for="senha">Nova Senha</label><input type="password" id="senha" minlength="6" required /></div>
        <div class="field"><label for="senha2">Confirmar Senha</label><input type="password" id="senha2" minlength="6" required /></div>
        <div class="bottom-area"><button type="submit" class="btn">Criar Senha</button></div>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
