<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu perfil</title>
  <script>document.documentElement.setAttribute("data-tema",localStorage.getItem("tema")==="escuro"||localStorage.getItem("tema")==="preto"?"escuro":"claro")</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header header-compact">
      <a href="home.html" class="back-btn" data-fallback="home.html"></a>
      <div class="logo logo-inline">
        <span class="logo-icon"></span>
        <span>CaisMed</span>
      </div>
    </header>

    <main class="app-body">
      <p class="intro-text left">Seus Dados</p>

      <div class="info-list" id="perfil-info">
        <div class="info-row"><span class="label">Nome Completo</span><span class="value" id="info-nome">—</span></div>
        <div class="info-row"><span class="label">CPF</span><span class="value" id="info-cpf">—</span></div>
        <div class="info-row"><span class="label">Telefone</span><span class="value" id="info-telefone">—</span></div>
        <div class="info-row"><span class="label">Email</span><span class="value" id="info-email">—</span></div>
        <div class="info-row"><span class="label">Cidade</span><span class="value" id="info-cidade">—</span></div>
        <div class="info-row"><span class="label">Plano</span><span class="value" id="info-plano">—</span></div>
      </div>

      <div class="bottom-area">
        <a href="perfil-editar.html" class="btn">Editar Dados</a>
        <a href="index.html" class="logout-link btn-outline">Sair da Conta</a>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
